name: ACMA26 One-time Format
on:
  push:
    branches:
      - feature/acma26-award-landing-2026
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/ACMA26/page.tsx src/app/ACMA26/acma26.module.css
      - name: Commit formatting only if changed
        run: |
          git add src/app/ACMA26/page.tsx src/app/ACMA26/acma26.module.css
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(acma26): apply Prettier formatting'
            git push origin HEAD:feature/acma26-award-landing-2026
          fi
